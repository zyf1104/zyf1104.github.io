@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #faf8f5; --card: #fff; --text: #3d3d3d; --text-light: #999;

}
body { font-family: 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

.header {
  background: linear-gradient(135deg, #2d4a3e 0%, #4a6b5c 100%);
  color: #fff; padding: 20px; text-align: center;
  position: sticky; top: 0; z-index: 1000;
  box-shadow: 0 4px 20px rgba(45,74,62,0.2);
}
.header h1 { font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 700; letter-spacing: 4px; }
.header .subtitle { font-size: 11px; opacity: 0.7; margin-top: 4px; letter-spacing: 2px; }
.progress-wrap { max-width: 300px; margin: 8px auto 0; background: rgba(255,255,255,0.15); border-radius: 20px; height: 4px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #f0d9a8, #d4a574); border-radius: 20px; transition: width 0.6s ease; width: 0%; }
.progress-text { margin-top: 6px; font-size: 11px; font-weight: 500; opacity: 0.9; }
.header-actions { margin-top: 8px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 4px 14px; border-radius: 20px; font-size: 11px; cursor: pointer; transition: var(--transition); }
.btn:hover { background: rgba(255,255,255,0.22); transform: translateY(-1px); }

.main { display: flex; height: calc(100vh - 160px); overflow: hidden; }

/* 左侧：地图 */
.map-panel {
  flex: 1;
  background: linear-gradient(180deg, #e8f0ec 0%, #f0ebe0 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.map-container {
  width: 100%; height: 100%; position: relative;
  display: flex; align-items: center; justify-content: center;
}
#chinaMap { width: 100%; height: 100%; max-height: 100%; }
#chinaMap .province {
  stroke: #ffffff; stroke-width: 1.1; cursor: pointer;
  transition: fill 0.25s ease, stroke 0.2s ease;
}
#chinaMap .province:hover { stroke: #2d4a3e; stroke-width: 1.8; }
#chinaMap .province.active { stroke: #d4a574; stroke-width: 2.2; }
.map-label {
  font-size: 11px; font-weight: 600; fill: #3d3d3d;
  pointer-events: none; text-anchor: middle;
  paint-order: stroke; stroke: rgba(255,255,255,0.85); stroke-width: 3px;
}
.map-legend {
  position: absolute; left: 12px; bottom: 10px; font-size: 10px;
  color: var(--text-light); background: rgba(255,255,255,0.75);
  padding: 6px 10px; border-radius: 10px; line-height: 1.7;
}
.map-legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }

/* 右侧：详情面板 */
.detail-panel {
  width: 380px;
  min-width: 380px;
  background: var(--card);
  border-left: 1px solid #e8e4dc;
  overflow-y: auto;
  padding: 20px;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-light);
}
.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state .text { font-size: 13px; }

.province-header {
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--accent-light);
}
.province-header h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 700;
  color: #2d4a3e;
}
.province-header .meta {
  font-size: 11px;
  color: var(--text-light);
  margin-top: 4px;
}

.city-block { margin-bottom: 16px; }
.city-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
  padding-left: 8px;
  border-left: 3px solid var(--accent);
}
.group-tag {
  font-size: 10px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
  display: inline-block;
  margin: 6px 0 8px;
}
.group-tag.spot { background: #e3f2fd; color: #1976d2; }
.group-tag.food { background: var(--warm-soft); color: #b8860b; }

.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}
.card {
  background: var(--bg);
  padding: 5px 5px 7px;
  border-radius: 8px;
  cursor: pointer;
  transition: var(--transition);
  user-select: none;
  position: relative;
  overflow: hidden;
}
html, body {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
img { -webkit-user-drag: none; user-drag: none; pointer-events: auto; }
}
.card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.card.checked { background: #f0f7f3; }
.card-photo {
  width: 100%;
  aspect-ratio: 4/3;
  border-radius: 5px;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  position: relative;
}
.card-photo.no-img {
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--accent-light), var(--accent));
}
.card-photo.no-img .placeholder-text { color: rgba(255,255,255,0.95); font-size: 9px; font-weight: 600; text-align: center; padding: 3px; }
.card.checked .card-photo::after {
  content: "✓";
  position: absolute;
  top: 3px; right: 3px;
  width: 16px; height: 16px;
  background: var(--accent); color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: bold;
}
.card-name { margin-top: 4px; font-size: 10px; font-weight: 500; text-align: center; }
.card.checked .card-name { text-decoration: line-through; opacity: 0.6; }

.lightbox {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.92); z-index: 9999;
  justify-content: center; align-items: center; cursor: zoom-out;
  backdrop-filter: blur(8px);
}
.lightbox.active { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.lightbox img { max-width: 90vw; max-height: 80vh; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
.lightbox-caption {
  position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 14px; font-weight: 600;
  background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px;
}
#importFile { display: none; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--accent-light); border-radius: 3px; }

@media (max-width: 700px) {
  .main { flex-direction: column; height: auto; }
  .map-panel { min-height: 300px; }
  .detail-panel { width: 100%; min-width: auto; border-left: none; border-top: 1px solid #e8e4dc; }
}

const STORAGE_KEY = 'travel-checklist-v3';
let checked = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
let currentProv = null;

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(checked));
  updateProgress();
  renderMap();
}

function toggle(key, e) {
  e.stopPropagation();
  if (checked[key]) delete checked[key];
  else checked[key] = true;
  save();
  renderDetail();
}

function updateProgress() {
  let total = 0, done = 0;
  for (const prov of PROVINCES) {
    for (const city of prov.cities) {
      total += city.spots.length + city.foods.length;
      for (const s of city.spots) if (checked[prov.name + '|' + s]) done++;
      for (const f of city.foods) if (checked[prov.name + '|' + f]) done++;
    }
  }
  const pct = total ? (done/total*100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = '已打卡 ' + done + ' / ' + total;
}

function provProgress(name) {
  const prov = PROVINCES.find(p => p.name === name);
  if (!prov) return { total: 0, done: 0, ratio: 0 };
  let total = 0, done = 0;
  for (const city of prov.cities) {
    total += city.spots.length + city.foods.length;
    for (const s of city.spots) if (checked[name + '|' + s]) done++;
    for (const f of city.foods) if (checked[name + '|' + f]) done++;
  }
  return { total, done, ratio: total ? done / total : 0 };
}

function geoBounds() {
  let minX = 180, maxX = -180, minY = 90, maxY = -90;
  const walk = (enc) => {
    const ring = decodeRing(enc);
    for (const [x, y] of ring) { if (x<minX) minX=x; if (x>maxX) maxX=x; if (y<minY) minY=y; if (y>maxY) maxY=y; }
  };
  for (const f of CHINA_GEO) {
    if (f[2] === 'Polygon') f[3].forEach(walk);
    else f[3].forEach(poly => poly.forEach(walk));
  }
  return [minX, minY, maxX, maxY];
}

let _proj = null;
function makeProj() {
  if (_proj) return _proj;
  const [minX, minY, maxX, maxY] = geoBounds();
  const W = 980, H = 860, pad = 30;
  const sx = (W - pad*2) / (maxX - minX);
  const sy = (H - pad*2) / (maxY - minY);
  const s = Math.min(sx, sy);
  const ox = pad + (W - pad*2 - s*(maxX-minX)) / 2;
  const oy = pad + (H - pad*2 - s*(maxY-minY)) / 2;
  _proj = (lon, lat) => [ox + (lon-minX)*s, oy + (maxY-lat)*s];
  return _proj;
}

function decodeRing(enc) {
  const ring = [[enc[0], enc[1]]];
  let px = enc[0], py = enc[1];
  for (let i = 2; i < enc.length; i += 2) {
    px += enc[i]; py += enc[i + 1];
    ring.push([px, py]);
  }
  return ring;
}

function ringPath(enc, proj) {
  const ring = decodeRing(enc);
  return ring.map((pt, i) => {
    const [x, y] = proj(pt[0], pt[1]);
    return (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ') + ' Z';
}

function renderMap() {
  const svg = document.getElementById('chinaMap');
  const proj = makeProj();
  let paths = '', labels = '';
  for (const f of CHINA_GEO) {
    const name = f[0], cp = f[1], type = f[2], coords = f[3];
    let d = '';
    if (type === 'Polygon') coords.forEach(ring => d += ringPath(ring, proj) + ' ');
    else coords.forEach(poly => poly.forEach(ring => d += ringPath(ring, proj) + ' '));
    const pr = provProgress(name);
    let fill = '#eef3f0';
    if (pr.ratio >= 1) fill = '#6b8e7f';
    else if (pr.ratio > 0) fill = '#a8c5b8';
    const isActive = currentProv === name;
    paths += '<path class="province' + (isActive ? ' active' : '') + '" d="' + d + '" fill="' + fill + '" onclick="selectProvince(\'' + name + '\')">';
    paths += '<title>' + name + ' · 已打卡 ' + pr.done + '/' + pr.total + '</title></path>';
    if (cp) {
      const [lx, ly] = proj(cp[0], cp[1]);
      labels += '<text class="map-label" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '">' + name + '</text>';
    }
  }
  svg.innerHTML = paths + labels;
}

function selectProvince(name) {
  currentProv = name;
  renderMap();
  renderDetail();
}

function renderDetail() {
  const panel = document.getElementById('detailPanel');
  if (!currentProv) {
    panel.innerHTML = '<div class="empty-state"><div class="icon">🗺️</div><div class="text">点击地图上的省份<br>查看必玩景点和必吃美食</div></div>';
    return;
  }
  const prov = PROVINCES.find(p => p.name === currentProv);
  if (!prov) return;

  let html = '';
  const totalSpots = prov.cities.reduce((sum, c) => sum + c.spots.length, 0);
  const totalFoods = prov.cities.reduce((sum, c) => sum + c.foods.length, 0);
  html += '<div class="province-header">';
  html += '<h2>' + prov.name + '</h2>';
  html += '<div class="meta">' + totalSpots + ' 个必玩景点 · ' + totalFoods + ' 道必吃美食</div>';
  html += '</div>';

  for (const city of prov.cities) {
    if (!city.spots.length && !city.foods.length) continue;
    html += '<div class="city-block">';
    html += '<div class="city-name">🏙️ ' + city.name + '</div>';

    if (city.spots.length) {
      html += '<div class="group-tag spot">🎯 必玩景点</div>';
      html += '<div class="card-grid">';
      for (const spot of city.spots) {
        const key = prov.name + '|' + spot;
        const isChecked = checked[key];
        const imgUrl = SPOT_IMGS[spot];
        html += '<div class="card' + (isChecked ? ' checked' : '') + '" onclick="toggle(\'' + key.replace(/'/g, "\'") + '\', event)">';
        if (imgUrl) {
          html += '<div class="card-photo" style="background-image:url(\'' + imgUrl + '\')" onclick="openLightbox(\'' + imgUrl + '\', \'' + spot.replace(/'/g, "\'") + '\', event)"></div>';
        } else {
          html += '<div class="card-photo no-img"><div class="placeholder-text">' + spot + '</div></div>';
        }
        html += '<div class="card-name">' + spot + '</div>';
        html += '</div>';
      }
      html += '</div>';
    }

    if (city.foods.length) {
      html += '<div class="group-tag food">🍜 必吃美食</div>';
      html += '<div class="card-grid">';
      for (const food of city.foods) {
        const key = prov.name + '|' + food;
        const isChecked = checked[key];
        const imgUrl = FOOD_IMGS[food];
        html += '<div class="card' + (isChecked ? ' checked' : '') + '" onclick="toggle(\'' + key.replace(/'/g, "\'") + '\', event)">';
        if (imgUrl) {
          html += '<div class="card-photo" style="background-image:url(\'' + imgUrl + '\')" onclick="openLightbox(\'' + imgUrl + '\', \'' + food.replace(/'/g, "\'") + '\', event)"></div>';
        } else {
          html += '<div class="card-photo no-img"><div class="placeholder-text">' + food + '</div></div>';
        }
        html += '<div class="card-name">' + food + '</div>';
        html += '</div>';
      }
      html += '</div>';
    }

    html += '</div>';
  }

  panel.innerHTML = html;
  panel.scrollTop = 0;
}

function openLightbox(imgUrl, caption, e) {
  e.stopPropagation();
  document.getElementById('lightboxImg').src = imgUrl;
  document.getElementById('lightboxCaption').textContent = caption;
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }

function exportData() {
  const blob = new Blob([JSON.stringify(checked, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'travel-progress.json';
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      checked = JSON.parse(ev.target.result);
      save();
      renderDetail();
      alert('导入成功！');
    } catch(err) { alert('导入失败'); }
  };
  reader.readAsText(file);
}

renderMap();
updateProgress();

/* ===== 防君子：禁用右键/查看源码/另存/图片拖拽（可被技术手段绕过，非绝对防护） ===== */
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('dragstart', function (e) {
  if (e.target && e.target.tagName === 'IMG') { e.preventDefault(); }
});
document.addEventListener('selectstart', function (e) { e.preventDefault(); });
document.addEventListener('keydown', function (e) {
  var k = e.key, mod = e.ctrlKey || e.metaKey;
  // F12 打开开发者工具
  if (k === 'F12') { e.preventDefault(); return; }
  // Ctrl/Cmd+U 查看源码、Ctrl/Cmd+S 另存、Ctrl/Cmd+Shift+I/J/C 开发者工具
  if (mod && (k === 'u' || k === 'U' || k === 's' || k === 'S' || k === 'i' || k === 'I' || k === 'j' || k === 'J' || k === 'c' || k === 'C')) {
    if (!(k === 'c' || k === 'C') || !e.shiftKey) { e.preventDefault(); }
  }
  // Ctrl/Cmd+Shift+I/J/C
  if (mod && e.shiftKey && ['I','J','C'].indexOf(k) >= 0) { e.preventDefault(); }
});
</script>
