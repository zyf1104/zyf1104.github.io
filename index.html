<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的小站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #ffffff; display: flex; justify-content: center; align-items: center; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 20px; padding: 60px 40px; text-align: center; max-width: 450px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .avatar { width: 100px; height: 100px; background: linear-gradient(45deg, #e94560, #f5a623); border-radius: 50%; margin: 0 auto 25px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 10px 30px rgba(233,69,96,0.4); }
        h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 10px; letter-spacing: 2px; }
        .tagline { font-size: 1.1rem; color: rgba(255,255,255,0.7); margin-bottom: 30px; line-height: 1.6; }
        .links a { display: inline-block; margin: 0 10px; color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,0.3); padding: 10px 25px; border-radius: 50px; font-size: 0.95rem; transition: all 0.3s; }
        .links a:hover { background: rgba(255,255,255,0.15); border-color: #fff; transform: translateY(-2px); }
        .footer-text { margin-top: 40px; font-size: 0.8rem; color: rgba(255,255,255,0.4); letter-spacing: 1px; }

        /* 登录框样式 */
        #login-screen input { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 12px 20px; border-radius: 50px; font-size: 1rem; text-align: center; outline: none; width: 200px; margin: 8px 0; display: block; margin-left: auto; margin-right: auto; }
        #login-screen input::placeholder { color: rgba(255,255,255,0.5); }
        #login-screen button { background: #e94560; border: none; color: #fff; padding: 12px 40px; border-radius: 50px; font-size: 1rem; cursor: pointer; transition: background 0.3s; margin-top: 15px; }
        #login-screen button:hover { background: #c23152; }
        .error-msg { color: #e94560; font-size: 0.9rem; margin-top: 10px; min-height: 20px; }
        #login-screen h2 { margin-bottom: 20px; }
        #login-screen label { display: block; text-align: left; width: 210px; margin: 5px auto 2px; font-size: 0.9rem; color: rgba(255,255,255,0.7); }

        /* 内容默认隐藏 */
        #main-content { display: none; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="card" id="login-screen">
        <div class="avatar">🔐</div>
        <h2>请登录</h2>
        <label for="username-input">用户名</label>
        <input type="text" id="username-input" placeholder="输入用户名">
        <label for="password-input">密码</label>
        <input type="password" id="password-input" placeholder="输入密码">
        <button onclick="checkLogin()">进入</button>
        <div class="error-msg" id="error-msg"></div>
    </div>

    <!-- 主内容（登录后可见） -->
    <div class="card" id="main-content">
        <div class="avatar">🚀</div>
        <h1 id="welcome-name">你好</h1>
        <p class="tagline">
            这里写一句自我介绍或自己喜欢的话。<br>
            比如：探索世界的好奇心。
        </p>
        <div class="links">
            <a href="#">项目</a>
            <a href="#">联系</a>
        </div>
        <p class="footer-text">© 2026 我的小站</p>
    </div>

    <script>
        // ====== 在这里添加用户，格式： { "用户名": "密码" } ======
        const USERS = {
            "Tony": "AUXzano4..@",
            "bob": "hello2026",
            "我": "mima"
        };

        function checkLogin() {
            const username = document.getElementById("username-input").value.trim();
            const password = document.getElementById("password-input").value;
            if (USERS[username] && USERS[username] === password) {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                document.getElementById("welcome-name").innerText = "欢迎，" + username;
            } else {
                document.getElementById("error-msg").innerText = "用户名或密码不对，再试试～";
                document.getElementById("password-input").value = "";
            }
        }
        // 按回车也可提交
        document.getElementById("password-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkLogin();
        });
    </script>
</body>
</html>
